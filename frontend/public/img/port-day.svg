<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8EEF5" />
      <stop offset="60%" stop-color="#F5F3EC" />
      <stop offset="100%" stop-color="#FBF8F2" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8FA8" />
      <stop offset="100%" stop-color="#3A6B88" />
    </linearGradient>
    <linearGradient id="quayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAE5DC" />
      <stop offset="100%" stop-color="#DDD7CB" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="20" stdDeviation="16" flood-color="#0B0F1A" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Sky & Atmosphere -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- Animated Sea Water Basin -->
  <polygon points="0,520 1150,220 1920,440 1920,1080 0,1080" fill="url(#seaGrad)" />
  <!-- Water facets -->
  <polygon points="200,640 450,580 320,720" fill="#679CB7" opacity="0.4" />
  <polygon points="600,560 850,510 740,640" fill="#679CB7" opacity="0.3" />
  <polygon points="1100,480 1380,440 1260,560" fill="#4D7F9B" opacity="0.5" />
  <polygon points="400,820 700,740 560,910" fill="#437592" opacity="0.4" />
  <polygon points="900,720 1200,660 1080,820" fill="#679CB7" opacity="0.25" />

  <!-- Port Quay Pier / Concrete Terminal Landmass -->
  <polygon points="0,380 980,140 1920,290 1920,740 1480,870 560,820 0,660" fill="url(#quayGrad)" filter="url(#softShadow)" />
  <!-- Quay Face (Vertical wall) -->
  <polygon points="0,660 560,820 1480,870 1920,740 1920,770 1480,905 560,855 0,695" fill="#8C8476" />
  <polygon points="0,695 560,855 1480,905 1920,770 1920,780 1480,915 560,865 0,705" fill="#585248" />

  <!-- Berth Edge Warning Line (Cobalt & Yellow) -->
  <polyline points="0,658 560,818 1480,868 1920,738" stroke="#1558C9" stroke-width="6" fill="none" />
  <polyline points="0,655 560,815 1480,865 1920,735" stroke="#D4FF24" stroke-width="3" stroke-dasharray="14 14" fill="none" />

  <!-- Warehouses & Logistics Sheds -->
  <g id="warehouses">
    <!-- Shed 1 -->
    <polygon points="120,380 280,335 340,360 180,405" fill="#D3CCC0" />
    <polygon points="280,335 340,360 340,430 280,405" fill="#A89F90" />
    <polygon points="120,380 180,405 180,475 120,450" fill="#BCB5A6" />
    <!-- Roof peak -->
    <polygon points="180,405 280,335 220,310 120,380" fill="#1558C9" opacity="0.85" />
    <!-- Shed 2 -->
    <polygon points="360,315 520,270 580,295 420,340" fill="#D3CCC0" />
    <polygon points="420,340 580,295 580,365 420,410" fill="#A89F90" />
    <polygon points="360,315 420,340 420,410 360,385" fill="#BCB5A6" />
    <polygon points="420,340 520,270 460,245 360,315" fill="#1558C9" opacity="0.85" />
  </g>

  <!-- Rail Siding & Train -->
  <g id="railways">
    <line x1="80" y1="460" x2="880" y2="240" stroke="#7A7468" stroke-width="4" stroke-dasharray="8 6" />
    <line x1="100" y1="475" x2="900" y2="255" stroke="#7A7468" stroke-width="4" stroke-dasharray="8 6" />
    <!-- Locomotive -->
    <polygon points="520,350 580,335 595,348 535,363" fill="#D4FF24" />
    <polygon points="535,363 595,348 595,370 535,385" fill="#1558C9" />
    <!-- Wagons -->
    <polygon points="450,370 505,355 520,368 465,383" fill="#8C3A27" />
    <polygon points="380,390 435,375 450,388 395,403" fill="#1558C9" />
    <polygon points="310,410 365,395 380,408 325,423" fill="#2E7D32" />
  </g>

  <!-- Container Yard (Stacks & RTG Gantries) -->
  <g id="yard">
    <!-- Block A -->
    <polygon points="450,480 620,435 650,455 480,500" fill="#1558C9" />
    <polygon points="480,500 650,455 650,485 480,530" fill="#0F47A3" />
    <polygon points="450,480 480,500 480,530 450,510" fill="#10387D" />

    <polygon points="500,465 670,420 700,440 530,485" fill="#D4FF24" />
    <polygon points="530,485 700,440 700,470 530,515" fill="#B2D81D" />

    <polygon points="550,450 720,405 750,425 580,470" fill="#C53030" />
    <polygon points="580,470 750,425 750,455 580,500" fill="#9B2323" />

    <!-- Block B -->
    <polygon points="680,520 850,475 880,495 710,540" fill="#2E7D32" />
    <polygon points="710,540 880,495 880,525 710,570" fill="#1E5622" />

    <polygon points="730,505 900,460 930,480 760,525" fill="#1558C9" />
    <polygon points="760,525 930,480 930,510 760,555" fill="#0F47A3" />

    <!-- RTG Cranes -->
    <path d="M 520,420 L 530,417 L 530,350 L 520,353 Z" fill="#D4FF24" />
    <path d="M 680,378 L 690,375 L 690,308 L 680,311 Z" fill="#D4FF24" />
    <polygon points="520,353 680,311 690,317 530,359" fill="#1558C9" />
  </g>

  <!-- Two Large Cargo Vessels at Berth -->
  <g id="vessels">
    <!-- Ship 1 (Capesize/Bulk Carrier at Berth 1) -->
    <!-- Shadow on water -->
    <polygon points="180,720 740,865 820,950 140,810" fill="#1B3342" opacity="0.4" />
    <!-- Hull Base -->
    <polygon points="200,710 720,845 760,890 680,910 180,770 150,735" fill="#1E293B" />
    <!-- Hull Top Deck -->
    <polygon points="200,705 720,840 760,885 680,905 180,765 150,730" fill="#94A3B8" />
    <!-- Superstructure / Bridge -->
    <polygon points="220,710 270,723 270,680 220,667" fill="#F8FAFC" />
    <polygon points="270,723 300,715 300,672 270,680" fill="#CBD5E1" />
    <!-- Container / Hatch Stacks on Deck -->
    <polygon points="320,735 440,766 440,795 320,764" fill="#1558C9" />
    <polygon points="460,771 580,802 580,831 460,800" fill="#C53030" />
    <polygon points="600,807 710,836 710,865 600,836" fill="#D4FF24" />

    <!-- Ship 2 (Berth 2) -->
    <polygon points="860,875 1420,1015 1460,1055 1380,1075 840,935 810,900" fill="#1E293B" />
    <polygon points="860,870 1420,1010 1460,1050 1380,1070 840,930 810,895" fill="#94A3B8" />
    <!-- Bridge -->
    <polygon points="870,872 920,885 920,842 870,829" fill="#F8FAFC" />
    <polygon points="980,895 1100,926 1100,955 980,924" fill="#1558C9" />
    <polygon points="1120,931 1240,962 1240,991 1120,960" fill="#2E7D32" />
    <polygon points="1260,967 1370,996 1370,1025 1260,996" fill="#D4FF24" />
  </g>

  <!-- Ship-to-Shore (STS) Gantry Cranes (Cobalt #1558C9 with lime accents) -->
  <g id="sts-cranes">
    <!-- Crane 1 -->
    <g transform="translate(380, 680)">
      <!-- Legs -->
      <line x1="0" y1="70" x2="30" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="60" y1="85" x2="45" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="10" y1="40" x2="50" y2="50" stroke="#1046A0" stroke-width="4" />
      <!-- Boom -->
      <line x1="-50" y1="-30" x2="160" y2="25" stroke="#1558C9" stroke-width="9" />
      <line x1="-50" y1="-35" x2="160" y2="20" stroke="#D4FF24" stroke-width="2" />
      <!-- Trolley & Spreader -->
      <rect x="75" y="0" width="16" height="12" fill="#D4FF24" rx="2" />
      <line x1="83" y1="12" x2="83" y2="45" stroke="#475569" stroke-width="2" />
      <rect x="71" y="45" width="24" height="6" fill="#0B0F1A" rx="1" />
    </g>

    <!-- Crane 2 -->
    <g transform="translate(560, 725)">
      <line x1="0" y1="70" x2="30" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="60" y1="85" x2="45" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="10" y1="40" x2="50" y2="50" stroke="#1046A0" stroke-width="4" />
      <line x1="-50" y1="-30" x2="160" y2="25" stroke="#1558C9" stroke-width="9" />
      <line x1="-50" y1="-35" x2="160" y2="20" stroke="#D4FF24" stroke-width="2" />
      <rect x="45" y="-9" width="16" height="12" fill="#D4FF24" rx="2" />
      <line x1="53" y1="3" x2="53" y2="35" stroke="#475569" stroke-width="2" />
      <rect x="41" y="35" width="24" height="6" fill="#0B0F1A" rx="1" />
    </g>

    <!-- Crane 3 -->
    <g transform="translate(1020, 840)">
      <line x1="0" y1="70" x2="30" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="60" y1="85" x2="45" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="10" y1="40" x2="50" y2="50" stroke="#1046A0" stroke-width="4" />
      <line x1="-50" y1="-30" x2="160" y2="25" stroke="#1558C9" stroke-width="9" />
      <line x1="-50" y1="-35" x2="160" y2="20" stroke="#D4FF24" stroke-width="2" />
      <rect x="90" y="5" width="16" height="12" fill="#D4FF24" rx="2" />
      <line x1="98" y1="17" x2="98" y2="50" stroke="#475569" stroke-width="2" />
      <rect x="86" y="50" width="24" height="6" fill="#0B0F1A" rx="1" />
    </g>

    <!-- Crane 4 -->
    <g transform="translate(1200, 885)">
      <line x1="0" y1="70" x2="30" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="60" y1="85" x2="45" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="10" y1="40" x2="50" y2="50" stroke="#1046A0" stroke-width="4" />
      <line x1="-50" y1="-30" x2="160" y2="25" stroke="#1558C9" stroke-width="9" />
      <line x1="-50" y1="-35" x2="160" y2="20" stroke="#D4FF24" stroke-width="2" />
      <rect x="30" y="-12" width="16" height="12" fill="#D4FF24" rx="2" />
      <line x1="38" y1="0" x2="38" y2="30" stroke="#475569" stroke-width="2" />
      <rect x="26" y="30" width="24" height="6" fill="#0B0F1A" rx="1" />
    </g>
  </g>

  <!-- Lighthouse on Breakwater (Right Side) -->
  <g id="lighthouse" transform="translate(1760, 260)">
    <!-- Breakwater -->
    <polygon points="-60,120 80,80 140,110 0,150" fill="#6B655A" />
    <!-- Tower -->
    <polygon points="10,100 25,10 45,10 60,100" fill="#F8FAFC" stroke="#E2E8F0" />
    <!-- Red band -->
    <polygon points="16,65 21,35 49,35 54,65" fill="#C53030" />
    <!-- Lantern Room -->
    <rect x="22" y="-5" width="26" height="15" fill="#1558C9" rx="2" />
    <!-- Rotating Lamp Beam -->
    <polygon points="35,2 -300,-150 -250,-80" fill="#D4FF24" opacity="0.35" />
  </g>
</svg>

