<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="duskSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E38" />
      <stop offset="45%" stop-color="#6B3352" />
      <stop offset="75%" stop-color="#D96B43" />
      <stop offset="100%" stop-color="#F2A562" />
    </linearGradient>
    <linearGradient id="duskSeaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232742" />
      <stop offset="100%" stop-color="#14182E" />
    </linearGradient>
    <linearGradient id="duskQuayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A454E" />
      <stop offset="100%" stop-color="#2C2834" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE484" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FFB800" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="limeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4FF24" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#D4FF24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D4FF24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky & Dusk Atmosphere -->
  <rect width="1920" height="1080" fill="url(#duskSkyGrad)" />

  <!-- Animated Sea Water Basin (Dark with reflections) -->
  <polygon points="0,520 1150,220 1920,440 1920,1080 0,1080" fill="url(#duskSeaGrad)" />

  <!-- Water light shimmers -->
  <polygon points="400,820 480,800 450,880" fill="#D96B43" opacity="0.3" />
  <polygon points="600,860 690,840 660,940" fill="#FFE484" opacity="0.35" />
  <polygon points="1050,960 1150,935 1100,1030" fill="#FFE484" opacity="0.35" />

  <!-- Port Quay Pier (Dusk lighting) -->
  <polygon points="0,380 980,140 1920,290 1920,740 1480,870 560,820 0,660" fill="url(#duskQuayGrad)" />
  <polygon points="0,660 560,820 1480,870 1920,740 1920,770 1480,905 560,855 0,695" fill="#1E1B24" />

  <!-- Berth Edge Warning Line -->
  <polyline points="0,658 560,818 1480,868 1920,738" stroke="#1558C9" stroke-width="6" fill="none" />
  <polyline points="0,655 560,815 1480,865 1920,735" stroke="#D4FF24" stroke-width="3" stroke-dasharray="14 14" fill="none" />

  <!-- Warehouses with Glowing Windows -->
  <g id="warehouses">
    <polygon points="120,380 280,335 340,360 180,405" fill="#3A3542" />
    <polygon points="280,335 340,360 340,430 280,405" fill="#25222D" />
    <polygon points="120,380 180,405 180,475 120,450" fill="#2C2834" />
    <polygon points="180,405 280,335 220,310 120,380" fill="#1558C9" opacity="0.75" />
    <!-- Glowing window stripes -->
    <polygon points="135,420 170,435 170,442 135,427" fill="#FFE484" />
    <polygon points="135,432 170,447 170,454 135,439" fill="#FFE484" />
  </g>

  <!-- Rail Siding & Train (Headlight on) -->
  <g id="railways">
    <line x1="80" y1="460" x2="880" y2="240" stroke="#3A3742" stroke-width="4" stroke-dasharray="8 6" />
    <polygon points="520,350 580,335 595,348 535,363" fill="#D4FF24" />
    <polygon points="535,363 595,348 595,370 535,385" fill="#1558C9" />
    <!-- Locomotive Headlight cone -->
    <polygon points="595,355 720,320 740,360" fill="#FFE484" opacity="0.35" />
  </g>

  <!-- Container Yard (Light towers active) -->
  <g id="yard">
    <polygon points="450,480 620,435 650,455 480,500" fill="#1558C9" />
    <polygon points="500,465 670,420 700,440 530,485" fill="#D4FF24" />
    <polygon points="550,450 720,405 750,425 580,470" fill="#9B2323" />
    <polygon points="680,520 850,475 880,495 710,540" fill="#1E5622" />

    <!-- Yard Floodlight Towers -->
    <line x1="510" y1="520" x2="510" y2="440" stroke="#7A7488" stroke-width="3" />
    <circle cx="510" cy="440" r="18" fill="url(#lampGlow)" />
    <line x1="720" y1="470" x2="720" y2="390" stroke="#7A7488" stroke-width="3" />
    <circle cx="720" cy="390" r="18" fill="url(#lampGlow)" />
  </g>

  <!-- Vessels with Deck Floodlights and Nav Lights -->
  <g id="vessels">
    <polygon points="200,710 720,845 760,890 680,910 180,770 150,735" fill="#0F172A" />
    <polygon points="200,705 720,840 760,885 680,905 180,765 150,730" fill="#334155" />
    <!-- Bridge glowing windows -->
    <polygon points="225,700 265,710 265,695 225,685" fill="#FFE484" />
    <!-- Nav lights -->
    <circle cx="150" cy="730" r="4" fill="#00FF66" />
    <circle cx="180" cy="765" r="4" fill="#FF3333" />

    <!-- Ship 2 -->
    <polygon points="860,875 1420,1015 1460,1055 1380,1075 840,935 810,900" fill="#0F172A" />
    <polygon points="860,870 1420,1010 1460,1050 1380,1070 840,930 810,895" fill="#334155" />
    <polygon points="875,865 915,875 915,860 875,850" fill="#FFE484" />
  </g>

  <!-- STS Cranes with Work Lights -->
  <g id="sts-cranes">
    <g transform="translate(380, 680)">
      <line x1="0" y1="70" x2="30" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="60" y1="85" x2="45" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="-50" y1="-30" x2="160" y2="25" stroke="#1558C9" stroke-width="9" />
      <!-- Work Light Cones downward onto ship -->
      <polygon points="40, -10 0, 90 80, 110" fill="#FFE484" opacity="0.3" />
      <polygon points="110, 10 70, 110 150, 130" fill="#FFE484" opacity="0.3" />
      <circle cx="40" cy="-10" r="10" fill="url(#lampGlow)" />
      <circle cx="110" cy="10" r="10" fill="url(#lampGlow)" />
    </g>

    <g transform="translate(560, 725)">
      <line x1="0" y1="70" x2="30" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="60" y1="85" x2="45" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="-50" y1="-30" x2="160" y2="25" stroke="#1558C9" stroke-width="9" />
      <polygon points="40, -10 0, 90 80, 110" fill="#FFE484" opacity="0.3" />
      <polygon points="110, 10 70, 110 150, 130" fill="#FFE484" opacity="0.3" />
      <circle cx="40" cy="-10" r="10" fill="url(#lampGlow)" />
      <circle cx="110" cy="10" r="10" fill="url(#lampGlow)" />
    </g>

    <g transform="translate(1020, 840)">
      <line x1="0" y1="70" x2="30" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="60" y1="85" x2="45" y2="-40" stroke="#1558C9" stroke-width="8" stroke-linecap="round" />
      <line x1="-50" y1="-30" x2="160" y2="25" stroke="#1558C9" stroke-width="9" />
      <polygon points="40, -10 0, 90 80, 110" fill="#FFE484" opacity="0.3" />
      <circle cx="40" cy="-10" r="10" fill="url(#lampGlow)" />
    </g>
  </g>

  <!-- Lighthouse with Sweeping Volumetric Beam -->
  <g id="lighthouse" transform="translate(1760, 260)">
    <polygon points="-60,120 80,80 140,110 0,150" fill="#332E3A" />
    <polygon points="10,100 25,10 45,10 60,100" fill="#E2E8F0" />
    <polygon points="16,65 21,35 49,35 54,65" fill="#9B2323" />
    <rect x="22" y="-5" width="26" height="15" fill="#1558C9" rx="2" />
    <!-- Giant Rotating Lantern Beam -->
    <polygon points="35,2 -800,200 -750,450" fill="url(#lampGlow)" opacity="0.5" />
    <circle cx="35" cy="2" r="28" fill="url(#limeGlow)" />
  </g>
</svg>

